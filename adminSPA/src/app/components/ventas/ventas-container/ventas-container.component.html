@if (loading) {
  <div class="d-flex justify-content-center align-items-center py-5">
    <span class="spinner-border text-primary"></span>
    <span class="ms-2">Cargando...</span>
  </div>
} @else if (isChildRoute) {
  <router-outlet />
} @else {
  @switch (codigoRubro) {
    @case ('GRF') {
      <app-ventas-grifo />
    }
    @case ('HOTEL') {
      <app-ventas-hoteles />
    }
    @case ('ROPA') {
      <app-ventas-ropa />
    }
    @case ('REST') {
      <app-ventas-restaurantes />
    }
    @default {
      <router-outlet />
    }
  }
}
