<div class="controls">
  <button (click)="addStem()">🍃 Agregar Tallo</button>
  <button (click)="addFlower()">➕ Agregar Flor</button>
  <button (click)="addLeaf()">🍃 Agregar Hoja</button>
  <input type="color" [(ngModel)]="selectedColor" />
</div>

<svg width="600" height="600" viewBox="0 0 600 600">
  <!-- Fondo -->
  <rect width="100%" height="100%" fill="#f5f5f5" />

  <!-- Jarrón (base del arreglo) -->
  <path d="M200,550 L400,550 L380,450 L220,450 Z" fill="#e6e6fa" stroke="#333" />

  <!-- Tallos -->
  <g *ngFor="let stem of stems()" (click)="selectStem(stem)">
    <path 
      [attr.d]="stem.path" 
      stroke="#2e8b57" 
      [attr.stroke-width]="stem.width" 
      fill="none" 
      [class.selected]="stem === selectedStem" />
  </g>

  <!-- Flores -->
  <g *ngFor="let flower of flowers()" (click)="selectElement(flower)">
    <path [attr.d]="flower.path" [attr.fill]="flower.color" />
    <circle *ngIf="flower.center" 
            [attr.cx]="flower.center.x" 
            [attr.cy]="flower.center.y" 
            [attr.r]="flower.center.radius" 
            fill="#FFD700" />
  </g>

  <!-- Hojas -->
  <path *ngFor="let leaf of leaves()" 
        [attr.d]="leaf.path" 
        [attr.fill]="leaf.color" 
        (click)="selectElement(leaf)" />
</svg>
