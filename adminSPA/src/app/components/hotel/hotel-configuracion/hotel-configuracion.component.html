<div class="page-body">
  <div class="container py-3" style="max-width: 640px;">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div>
        <h1 class="h4 mb-1">Configuración hotel</h1>
        <p class="text-muted small mb-0">Horarios de check-in/out y reglas de disponibilidad (solo rubro HOTEL).</p>
      </div>
      <a routerLink="/ventas" class="btn btn-outline-secondary btn-sm">Volver a recepción</a>
    </div>

    @if (loading) {
      <p class="text-muted">Cargando…</p>
    } @else {
      @if (errorMessage) {
        <div class="alert alert-danger">{{ errorMessage }}</div>
      }
      <div class="card">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Hora check-in</label>
              <input type="time" class="form-control" [(ngModel)]="form.horaCheckIn" step="1" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Hora check-out</label>
              <input type="time" class="form-control" [(ngModel)]="form.horaCheckOut" step="1" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Hora corte día</label>
              <input type="time" class="form-control" [(ngModel)]="form.horaCorteDia" step="1" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Minutos limpieza entre huéspedes</label>
              <input type="number" class="form-control" [(ngModel)]="form.minutosLimpieza" min="0" max="240" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Noches mínimas walk-in</label>
              <input type="number" class="form-control" [(ngModel)]="form.nochesMinimasWalkIn" min="1" max="30" />
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="walkIn" [(ngModel)]="form.permitirWalkInSinReserva" />
                <label class="form-check-label" for="walkIn">Permitir check-in walk-in sin reserva previa</label>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Recargo early check-in (S/)</label>
              <input type="number" class="form-control" [(ngModel)]="form.recargoEarlyCheckIn" min="0" step="0.01" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Recargo late check-out (S/)</label>
              <input type="number" class="form-control" [(ngModel)]="form.recargoLateCheckOut" min="0" step="0.01" />
            </div>
          </div>
          <div class="mt-4">
            <button type="button" class="btn btn-primary" (click)="guardar()" [disabled]="guardando">
              @if (guardando) { Guardando… } @else { Guardar configuración }
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
