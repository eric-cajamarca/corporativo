<div class="verificar-container">
  <div class="verificar-card auth-form-shell">
    <div class="verificar-header">
      <i class="fas fa-check-double fa-3x text-primary mb-3"></i>
      <h1>Activar tu cuenta</h1>
      <p class="text-muted">Ingresa el código de 6 dígitos que te enviamos por WhatsApp y correo.</p>
    </div>
    <form (ngSubmit)="verificar()" class="verificar-form">
      <div class="mb-3">
        <label class="form-label">ID de empresa</label>
        @if (idEmpresa()) {
          <p class="form-control-plaintext text-muted mb-0" style="font-family: monospace; letter-spacing: 0.05em;">{{ idEmpresaMasked() }}</p>
          <small class="text-muted">Solo se muestran los últimos dígitos por seguridad.</small>
        } @else {
          <input type="text" id="idEmpresa" class="form-control"
            [value]="idEmpresa()" (input)="idEmpresa.set($any($event.target).value)"
            placeholder="Pega el ID de empresa que te enviamos" />
        }
      </div>
      <div class="mb-3">
        <label for="codigo" class="form-label">Código de verificación</label>
        <input type="text" id="codigo" class="form-control form-control-lg text-center"
          [value]="codigo()" (input)="codigo.set($any($event.target).value)"
          placeholder="123456" maxlength="6" />
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100 mb-2" [disabled]="enviando()">
        @if (enviando()) { <span class="spinner-border spinner-border-sm me-2"></span> }
        Activar cuenta
      </button>
      <button type="button" class="btn btn-outline-primary w-100 mb-2" (click)="reenviarCodigo()" [disabled]="reenviando() || !idEmpresa()">
        @if (reenviando()) { <span class="spinner-border spinner-border-sm me-2"></span> }
        Reenviar código por WhatsApp y correo
      </button>
      <button type="button" class="btn btn-outline-secondary w-100" (click)="irALogin()">Ir a Iniciar sesión</button>
    </form>
  </div>
</div>
