<div class="page-body">
    <div class="container-fluid">
        <div class="row justify-content-center min-vh-100 align-items-center" style="background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card border-0 shadow-lg rounded-3 overflow-hidden">
                    <!-- Card Header with Gradient Background -->
                    <div class="card-header bg-primary text-white py-4">
                        <h2 class="h4 mb-0 text-center">
                            <i class="bi bi-person-plus me-2"></i> Crear Nuevo Rol
                        </h2>
                    </div>
                    
                    <!-- Card Body -->
                    <div class="card-body p-4 p-md-5">
                        <form class="form" #registroForm="ngForm" (ngSubmit)="registrar(registroForm)">
                            <div class="mb-4">
                                <label for="rolName" class="form-label fw-semibold">Nombre del rol</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light">
                                        <i class="bi bi-tag text-primary"></i>
                                    </span>
                                    <input type="text" 
                                           class="form-control form-control-lg" 
                                           id="rolName"
                                           name="descripcion" 
                                           [(ngModel)]="rol.descripcion" 
                                           placeholder="Ingrese el nombre del rol" 
                                           required
                                           autofocus>
                                </div>
                                <div class="form-text text-muted">Ejemplo: Administrador, Usuario, Supervisor</div>
                            </div>
                            
                            <div class="d-grid gap-3 d-md-flex justify-content-md-end mt-4 pt-3">
                                <a routerLink="/rol" class="btn btn-outline-secondary me-md-2 px-4">
                                    <i class="bi bi-arrow-left me-2"></i> Regresar
                                </a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check-circle me-2"></i> Crear Rol
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
