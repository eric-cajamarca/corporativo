<section class="ayuda-facturacion" aria-labelledby="ayudaFacturacionTitulo">
  @if (dismissible) {
    <button type="button" class="ayuda-facturacion-close" (click)="ocultar()" aria-label="Ocultar ayuda">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  }
  <div class="ayuda-facturacion-main">
    <span class="ayuda-facturacion-icon" aria-hidden="true">
      <i class="bi bi-receipt-cutoff"></i>
    </span>
    <div class="ayuda-facturacion-copy">
      <h3 id="ayudaFacturacionTitulo">Configura la facturación electrónica de tu empresa</h3>
      <p>
        Primero revisa el tutorial. Si te trabas con el usuario secundario SUNAT, el certificado tributario
        o los impuestos, escríbenos por WhatsApp.
      </p>
    </div>
  </div>
  <div class="ayuda-facturacion-actions">
    <button type="button" class="btn btn-outline-primary" (click)="abrirTutorial()">
      <i class="bi bi-book me-1" aria-hidden="true"></i>
      Ver tutorial
    </button>
    <a class="btn btn-whatsapp-ayuda" [href]="whatsappUrl" target="_blank" rel="noopener">
      <i class="bi bi-whatsapp me-1" aria-hidden="true"></i>
      WhatsApp {{ whatsappDisplay }}
    </a>
    @if (mostrarIrAConfigurar) {
      <a class="btn btn-primary" routerLink="/configuracion" [queryParams]="{ tab: 'facturacion' }">
        Ir a configurar
      </a>
    }
  </div>
</section>
