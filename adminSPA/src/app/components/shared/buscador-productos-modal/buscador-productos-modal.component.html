<div class="modal-header bg-primary text-white">
  <h5 class="modal-title">Buscar productos</h5>
  <button type="button" class="btn-close btn-close-white" aria-label="Cerrar" (click)="cerrar()"></button>
</div>
<div class="modal-body">
  <div class="row mb-3">
    <div class="col-md-8">
      <input type="search" class="form-control" placeholder="Nombre o código..." [(ngModel)]="searchTerm"
        (input)="buscarProductos()">
    </div>
    <div class="col-md-4">
      <button type="button" class="btn btn-outline-success w-100" (click)="buscarProductos()">
        <i class="bi bi-search"></i> Buscar
      </button>
    </div>
  </div>
  <p class="text-muted small mb-0" *ngIf="loading"><i class="bi bi-hourglass-split"></i> Cargando productos...</p>
  <div class="table-responsive" style="max-height: 300px;" *ngIf="!loading">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light sticky-top">
        <tr>
          <th>Código</th>
          <th>Categoría</th>
          <th>Producto</th>
          <th>U.Medida</th>
          <th>Precio</th>
          <th>Sucursal</th>
          <th>Stock</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of productosFiltrados" role="button" class="table-row-hover" (click)="seleccionar(p)">
          <td>{{ p.codigo }}</td>
          <td>{{ p.categoria }}</td>
          <td>{{ p.descripcion }}</td>
          <td>{{ p.codigoPresentacion }}</td>
          <td>S/ {{ p.pVenta | number:'1.2-2' }}</td>
          <td>{{ p.sucursal }}</td>
          <td>{{ p.stock }}</td>
          <td><i class="bi bi-plus-circle-fill text-success"></i></td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="text-muted small mt-2 mb-0" *ngIf="!loading && productosFiltrados.length === 0">No hay productos que coincidan.</p>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="cerrar()">Cerrar</button>
</div>
