@if (esModal) {
  <div class="p-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Crear nueva categoría</h5>
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancelar()">Cerrar</button>
    </div>

    <form class="form" id="kt_form" #registroForm="ngForm" (ngSubmit)="registrar(registroForm)">
      <div class="form-group mb-3">
        <label for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" [(ngModel)]="categorias.nombre"
          required appFormatSentence maxlength="80">
      </div>
      <div class="form-group mb-3">
        <label for="descripcion">Descripción</label>
        <textarea class="form-control" id="descripcion" name="descripcion" [(ngModel)]="categorias.descripcion"
          required appFormatSentence maxlength="200"></textarea>
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-warning" (click)="cancelar()">Regresar</button>
        <button *ngIf="!btn_registrar" type="submit" class="btn btn-success">Registrar</button>
        <button *ngIf="btn_registrar" type="button" class="btn btn-success font-weight-bolder px-4" disabled>
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          Registrando...
        </button>
      </div>
    </form>
  </div>
} @else {
  <app-topnav></app-topnav>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h4 class="card-header-title">Crear nueva categoría.</h4>
      </div>

      <div class="card-body">
        <form class="form" id="kt_form" #registroForm="ngForm" (ngSubmit)="registrar(registroForm)">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" class="form-control" id="nombre" name="nombre" [(ngModel)]="categorias.nombre"
              required appFormatSentence maxlength="80">
          </div>
          <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea class="form-control" id="descripcion" name="descripcion" [(ngModel)]="categorias.descripcion"
              required appFormatSentence maxlength="200"></textarea>
          </div>

          <div class="form-group" style="margin-top: 20px;">
            <div>
              <button type="button" class="btn btn-warning" style="margin-right: 15px;" (click)="cancelar()">Regresar</button>
              <button *ngIf="!btn_registrar" type="submit" class="btn btn-success">Registrar</button>
              <button *ngIf="btn_registrar" type="button" class="btn btn-success font-weight-bolder px-9 py-4" disabled>
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Registrando...
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
}
