<div class="recovery-container">
  <div class="recovery-wrapper">
    <div class="recovery-card auth-form-shell">
      <div class="recovery-header">
        <h1 class="recovery-title">Recuperar contraseña</h1>
        <p class="recovery-subtitle">
          {{ paso === 1 ? 'Ingrese el RUC de la empresa y su correo' : 'Establezca su nueva contraseña' }}
        </p>
      </div>

      <div class="recovery-body">
        <!-- Paso 1: Solicitar token -->
        <div *ngIf="paso === 1" class="recovery-form">
          <div class="form-group">
            <label for="ruc">RUC de la empresa</label>
            <input id="ruc" type="text" class="form-control" [(ngModel)]="ruc" (blur)="validateRuc()"
                   maxlength="11" placeholder="11 dígitos" [class.is-invalid]="rucInvalid">
            <small *ngIf="rucInvalid" class="text-danger">RUC inválido (11 dígitos, empieza con 1 o 2)</small>
          </div>
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" class="form-control" [(ngModel)]="email" (blur)="validateEmail()"
                   placeholder="correo@ejemplo.com" [class.is-invalid]="emailInvalid">
            <small *ngIf="emailInvalid" class="text-danger">Correo inválido</small>
          </div>
          <p class="recovery-hint">Se enviará un enlace de recuperación al correo registrado (empresa o colaborador).</p>
          <button type="button" class="btn btn-primary btn-block" [disabled]="loading" (click)="solicitar()">
            <span *ngIf="!loading">Enviar enlace a mi correo</span>
            <span *ngIf="loading">Enviando...</span>
          </button>
        </div>

        <!-- Paso 2: Nueva contraseña (solo al abrir el enlace recibido por correo) -->
        <div *ngIf="paso === 2" class="recovery-form">
          <div class="form-group">
            <label for="newPassword">Nueva contraseña</label>
            <input id="newPassword" type="password" class="form-control" [(ngModel)]="newPassword"
                   placeholder="Mínimo 6 caracteres" minlength="6">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input id="confirmPassword" type="password" class="form-control" [(ngModel)]="confirmPassword"
                   placeholder="Repita la contraseña">
          </div>
          <button type="button" class="btn btn-primary btn-block" [disabled]="loading" (click)="restablecer()">
            <span *ngIf="!loading">Restablecer contraseña</span>
            <span *ngIf="loading">Guardando...</span>
          </button>
        </div>

        <div class="recovery-footer">
          <a href="#" class="link-back" (click)="volverALogin(); $event.preventDefault()">
            <i class="fas fa-arrow-left"></i> Volver al inicio de sesión
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
