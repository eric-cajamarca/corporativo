<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h3>{{ isEditMode ? 'Editar' : 'Nuevo' }} Lote</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="loteForm" (ngSubmit)="guardarLote()">
        
        <!-- Producto -->
        <div class="mb-3">
          <label for="producto" class="form-label">Producto *</label>
          <select id="producto" formControlName="idProducto" class="form-control">
            <option value="" disabled>Seleccione un producto</option>
            <!-- Aquí deberías cargar productos de tu API -->
            <option value="UUID_PRODUCTO_1">Producto 1</option>
          </select>
        </div>

        <!-- Sucursal -->
        <div class="mb-3">
          <label for="sucursal" class="form-label">Sucursal *</label>
          <select id="sucursal" formControlName="idSucursal" class="form-control">
            <option value="" disabled>Seleccione sucursal</option>
            <!-- Aquí deberías cargar sucursales -->
            <option value="UUID_SUCURSAL_1">Sucursal Principal</option>
          </select>
        </div>

        <!-- Costo Unitario -->
        <div class="mb-3">
          <label for="costo" class="form-label">Costo Unitario *</label>
          <input 
            type="number" 
            id="costo" 
            formControlName="costoUnitario" 
            class="form-control"
            placeholder="0.00"
            step="0.01"
          >
        </div>

        <!-- Cantidad Ingresada -->
        <div class="mb-3">
          <label for="cantidad" class="form-label">Cantidad Ingresada *</label>
          <input 
            type="number" 
            id="cantidad" 
            formControlName="cantidadIngresada" 
            class="form-control"
            placeholder="0"
            min="1"
          >
        </div>

        <!-- Botones -->
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="loteForm.invalid">
            <i class="bi bi-save"></i> {{ isEditMode ? 'Actualizar' : 'Guardar' }}
          </button>
          <button type="button" class="btn btn-secondary" (click)="cancelar()">
            <i class="bi bi-arrow-left"></i> Cancelar
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
