<app-topnav></app-topnav>
<div class="container mt-4">
  <h2>📍 Gestión de Ubicaciones</h2>
  <p class="text-muted">Define el orden en que se consume el stock (1=Primero)</p>

  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border text-primary"></div>
  </div>

  <!-- Contenido -->
  <div *ngIf="!isLoading">
    <!-- Itera por sucursales -->
    <div *ngFor="let sucursalKey of ubicacionesPorSucursal | keyvalue">
      <div class="card mb-4">
        <div class="card-header bg-secondary text-white">
          <h4>Sucursal: {{ sucursalKey.key }}</h4>
        </div>
        <div class="card-body">
          <table class="table table-sm">
            <thead>
              <tr>
                <th>Prioridad</th>
                <th>Código Ubicación</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let ubicacion of sucursalKey.value">
                <td>
                  <input 
                    type="number" 
                    class="form-control form-control-sm" 
                    [value]="ubicacion.prioridad"
                    (blur)="onPrioridadBlur(ubicacion.idUbicacion!, $event)"
                    style="width: 80px;"
                  >
                </td>
                <td>{{ ubicacion.codigoUbicacion }}</td>
                <td>
                  <button class="btn btn-sm btn-outline-danger" (click)="eliminarUbicacion(ubicacion.idUbicacion!)">
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
