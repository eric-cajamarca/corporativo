<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Banner 75 × 145 cm — Business Soft Company SAC</title>
  <style>
    @page { size: 750mm 1450mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 750mm;
      height: 1450mm;
      overflow: hidden;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 1450mm;
    }
    .header {
      background: #ffffff;
      flex: 0 0 33%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 18mm 16mm 8mm;
      gap: 2mm;
    }
    .header img {
      width: 96%;
      max-height: 82%;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .company {
      font-size: 34mm;
      font-weight: 800;
      color: #0a2740;
      letter-spacing: -0.7mm;
      text-align: center;
      line-height: 1;
      white-space: nowrap;
    }
    .mid {
      background: #0c3a56;
      flex: 1 1 auto;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20mm 28mm 18mm;
      text-align: center;
      gap: 12mm;
    }
    .headline {
      font-size: 78mm;
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -1.8mm;
    }
    .bullets {
      text-align: left;
      font-size: 32mm;
      font-weight: 700;
      line-height: 1.18;
      width: 100%;
      max-width: 700mm;
    }
    .bullets div {
      display: flex;
      align-items: center;
      gap: 10mm;
    }
    .check {
      color: #3ec6f0;
      font-size: 36mm;
      font-weight: 900;
      line-height: 1;
      flex-shrink: 0;
    }
    .offer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6mm;
    }
    .cta {
      background: #2eb6ef;
      color: #0a2740;
      font-size: 40mm;
      font-weight: 800;
      padding: 8mm 28mm;
      border-radius: 8mm;
      letter-spacing: -0.3mm;
      line-height: 1;
    }
    .place {
      font-size: 24mm;
      font-weight: 700;
      color: #d7eef8;
    }
    .footer {
      background: #6fd0f5;
      flex: 0 0 17%;
      color: #0a2740;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10mm 14mm 12mm;
      text-align: center;
      font-weight: 800;
      gap: 6mm;
    }
    .find { font-size: 24mm; line-height: 1; }
    .handle {
      font-size: 30mm;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7mm;
      line-height: 1;
      letter-spacing: -0.5mm;
      white-space: nowrap;
    }
    .wa { width: 32mm; height: 32mm; flex-shrink: 0; }
    .web { font-size: 28mm; line-height: 1; }
  </style>
</head>
<body>
  <header class="header">
    <img src="logo-bsc-print.png" alt="Business Soft Company" />
    <div class="company">BUSINESS SOFT COMPANY SAC</div>
  </header>
  <section class="mid">
    <div class="headline">Formalízate<br>sin complicarte</div>
    <div class="bullets">
      <div><span class="check">✓</span><span>Factura electrónica SUNAT</span></div>
      <div><span class="check">✓</span><span>Controla tu inventario</span></div>
      <div><span class="check">✓</span><span>Conoce lo que ganas</span></div>
    </div>
    <div class="offer">
      <div class="cta">14 días gratis</div>
      <div class="place">Jaén · Cajamarca</div>
    </div>
  </section>
  <footer class="footer">
    <div class="find">Encuéntranos en WhatsApp:</div>
    <div class="handle">
      <svg class="wa" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="12" fill="#25D366"/>
        <path fill="#fff" d="M16.6 14.7c-.2-.1-1.3-.6-1.5-.7-.2-.1-.4-.1-.5.1-.2.2-.6.7-.7.8-.1.1-.3.2-.5.1-.2-.1-.9-.3-1.7-1-.6-.6-1.1-1.2-1.2-1.4-.1-.2 0-.4.1-.5l.4-.5c.1-.1.2-.3.2-.4 0-.1 0-.3-.1-.4l-.7-1.6c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9 0 1.1.8 2.2.9 2.3.1.2 1.6 2.5 3.9 3.4.5.2 1 .4 1.3.5.6.2 1.1.2 1.5.1.5-.1 1.3-.5 1.5-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/>
        <path fill="#fff" d="M12.04 4.5A7.5 7.5 0 0 0 5.3 16.1L4.5 19.5l3.5-.8A7.5 7.5 0 1 0 12.04 4.5zm0 13.6c-1.2 0-2.4-.3-3.4-.9l-.25-.15-2.08.48.5-2.02-.16-.26a6.05 6.05 0 1 1 5.4 2.85z"/>
      </svg>
      @businesssoftcompanysac
    </div>
    <div class="web">www.businesssoft.net</div>
  </footer>
</body>
</html>
