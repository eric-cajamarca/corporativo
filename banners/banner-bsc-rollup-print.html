<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Roll-up 85 × 200 cm — Business Soft Company SAC</title>
  <style>
    @page { size: 850mm 2000mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 850mm;
      height: 2000mm;
      overflow: hidden;
      background: #0c3a56;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #ffffff;
      height: 620mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 36mm 40mm 28mm;
    }
    .header img {
      height: 430mm;
      width: auto;
      display: block;
    }
    .company {
      margin-top: 8mm;
      font-size: 40mm;
      font-weight: 800;
      color: #0a2740;
      letter-spacing: -0.8mm;
      text-align: center;
      line-height: 1.05;
      white-space: nowrap;
    }
    .mid {
      background: #0c3a56;
      flex: 1;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20mm 48mm 16mm;
      text-align: center;
    }
    .headline {
      font-size: 78mm;
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -1.6mm;
    }
    .bullets {
      margin-top: 36mm;
      text-align: left;
      font-size: 36mm;
      font-weight: 700;
      line-height: 1.38;
      width: 100%;
      max-width: 760mm;
    }
    .bullets div {
      display: flex;
      align-items: center;
      gap: 16mm;
      margin: 6mm 0;
    }
    .check {
      color: #3ec6f0;
      font-size: 42mm;
      font-weight: 900;
      line-height: 1;
      flex-shrink: 0;
    }
    .cta {
      margin-top: 34mm;
      background: #2eb6ef;
      color: #0a2740;
      font-size: 46mm;
      font-weight: 800;
      padding: 12mm 42mm;
      border-radius: 10mm;
      letter-spacing: -0.6mm;
      line-height: 1;
    }
    .place {
      margin-top: 16mm;
      font-size: 28mm;
      font-weight: 700;
      color: #d7eef8;
    }
    .footer {
      background: #6fd0f5;
      height: 400mm;
      color: #0a2740;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28mm 36mm 0;
      text-align: center;
      font-weight: 800;
    }
    .find {
      font-size: 30mm;
      line-height: 1.1;
    }
    .handle {
      margin-top: 12mm;
      font-size: 40mm;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12mm;
      line-height: 1;
      letter-spacing: -0.5mm;
    }
    .wa {
      width: 44mm;
      height: 44mm;
      flex-shrink: 0;
    }
    .web {
      margin-top: 12mm;
      font-size: 36mm;
      line-height: 1;
    }
    .cassette {
      margin-top: auto;
      height: 170mm;
      width: 100%;
    }
  </style>
</head>
<body>
  <header class="header">
    <img src="logo-bsc-print.png" alt="Business Soft Company" />
    <div class="company">BUSINESS SOFT COMPANY SAC</div>
  </header>
  <section class="mid">
    <div class="headline">Formalízate<br>sin complicarte</div>
    <div class="bullets">
      <div><span class="check">✓</span><span>Factura electrónica SUNAT</span></div>
      <div><span class="check">✓</span><span>Controla tu inventario</span></div>
      <div><span class="check">✓</span><span>Conoce lo que ganas</span></div>
    </div>
    <div class="cta">14 días gratis</div>
    <div class="place">Jaén · Cajamarca</div>
  </section>
  <footer class="footer">
    <div class="find">Encuéntranos en WhatsApp:</div>
    <div class="handle">
      <svg class="wa" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="12" fill="#25D366"/>
        <path fill="#fff" d="M16.6 14.7c-.2-.1-1.3-.6-1.5-.7-.2-.1-.4-.1-.5.1-.2.2-.6.7-.7.8-.1.1-.3.2-.5.1-.2-.1-.9-.3-1.7-1-.6-.6-1.1-1.2-1.2-1.4-.1-.2 0-.4.1-.5l.4-.5c.1-.1.2-.3.2-.4 0-.1 0-.3-.1-.4l-.7-1.6c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9 0 1.1.8 2.2.9 2.3.1.2 1.6 2.5 3.9 3.4.5.2 1 .4 1.3.5.6.2 1.1.2 1.5.1.5-.1 1.3-.5 1.5-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/>
        <path fill="#fff" d="M12.04 4.5A7.5 7.5 0 0 0 5.3 16.1L4.5 19.5l3.5-.8A7.5 7.5 0 1 0 12.04 4.5zm0 13.6c-1.2 0-2.4-.3-3.4-.9l-.25-.15-2.08.48.5-2.02-.16-.26a6.05 6.05 0 1 1 5.4 2.85z"/>
      </svg>
      @businesssoftcompanysac
    </div>
    <div class="web">www.businesssoft.net</div>
    <div class="cassette"></div>
  </footer>
</body>
</html>
